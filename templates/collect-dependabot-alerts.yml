name: Send Dependabot alerts to OpenComputer

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencomputer-dependabot-alerts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Submit open alerts
        shell: bash
        env:
          DEPENDABOT_READ_TOKEN: ${{ secrets.DEPENDABOT_READ_TOKEN }}
          OPENCOMPUTER_WEBHOOK_TOKEN: ${{ secrets.OPENCOMPUTER_WEBHOOK_TOKEN }}
          OPENCOMPUTER_WEBHOOK_URL: ${{ secrets.OPENCOMPUTER_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_READ_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          test -n "$DEPENDABOT_READ_TOKEN"
          test -n "$OPENCOMPUTER_WEBHOOK_TOKEN"
          test -n "$OPENCOMPUTER_WEBHOOK_URL"

          alerts_file="${RUNNER_TEMP}/dependabot-alerts.json"
          gh api --paginate --slurp \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${REPOSITORY}/dependabot/alerts?state=open&ecosystem=npm&per_page=100" \
            > "$alerts_file"

          jq -c '.[][] | select(.number > 0 and (.updated_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))) | {number, updated_at}' "$alerts_file" |
          while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"
            updated_at="$(jq -r '.updated_at' <<<"$alert")"
            body="$(jq -cn \
              --arg text "Assess Dependabot alert ${number}." \
              --argjson repositoryId "$REPOSITORY_ID" \
              --argjson alertNumber "$number" \
              --arg alertUpdatedAt "$updated_at" \
              '{text: $text, payload: {event: "github.dependabot.alert.open", repositoryId: $repositoryId, alertNumber: $alertNumber, alertUpdatedAt: $alertUpdatedAt}}')"
            idempotency_key="dependabot-${REPOSITORY_ID}-${number}-${updated_at}"
            response_file="${RUNNER_TEMP}/opencomputer-response-${number}.json"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${OPENCOMPUTER_WEBHOOK_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "Idempotency-Key: ${idempotency_key}" \
              --data "$body" \
              "$OPENCOMPUTER_WEBHOOK_URL")"
            if [[ "$status" != "202" ]]; then
              echo "OpenComputer webhook returned HTTP ${status} for alert ${number}" >&2
              jq '{error, message}' "$response_file" 2>/dev/null || true
              exit 1
            fi
            jq '{sessionId, sessionUrl}' "$response_file"
          done
